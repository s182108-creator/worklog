<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업일지 뷰어</title>
    <style>
        :root { --bg-body: #f8f9fa; --bg-card: #ffffff; --text-main: #2c3e50; --border: #dee2e6; --accent: #e74c3c; }
        @media (prefers-color-scheme: dark) { :root { --bg-body: #121212; --bg-card: #1e1e1e; --text-main: #e0e0e0; --border: #333333; } }
        body { font-family: sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .viewer-summary {
            background: #34495e; color: white; padding: 15px; border-radius: 12px;
            display: flex; justify-content: space-around; margin-bottom: 10px;
            position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .sum-item { text-align: center; flex: 1; }
        .sum-label { font-size: 11px; opacity: 0.8; }
        .sum-value { font-size: 1.2em; font-weight: bold; margin-top: 4px; }

        .filter-bar {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--bg-card); padding: 12px; border-radius: 10px;
            margin-bottom: 15px; border: 1px solid var(--border);
        }
        .filter-bar select { padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 14px; }

        .table-wrapper { background: var(--bg-card); border-radius: 12px; overflow-x: auto; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: rgba(0,0,0,0.05); padding: 12px; font-size: 13px; border-bottom: 2px solid var(--border); text-align: left; }
        td { padding: 12px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
        
        .amt-text { color: #e67e22; font-weight: bold; }
        .my-biz-badge { background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        
        .note-text { 
            font-size: 12px; color: #7f8c8d; max-width: 200px; cursor: pointer; transition: all 0.2s ease; position: relative;
        }
        .note-truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-full { white-space: normal; overflow: visible; color: var(--text-main); background: rgba(231, 76, 60, 0.05); border-radius: 4px; }
        
        #loader { text-align: center; padding: 50px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="viewer-summary">
        <div class="sum-item"><div class="sum-label">총 작업 매출 (제외항목 미포함)</div><div id="vTotal" class="sum-value">0원</div></div>
        <div class="sum-item" style="border-left: 1px solid rgba(255,255,255,0.2);">
            <div class="sum-label">월급 자동계산</div>
            <div id="vShare" class="sum-value" style="color: #f1c40f;">0원</div>
        </div>
    </div>

    <div class="filter-bar">
        <span>📅 조회 기간:</span>
        <select id="filterYear" onchange="applyFilter()"></select>
        <select id="filterMonth" onchange="applyFilter()">
            <option value="all">전체보기</option>
            <option value="01">1월</option><option value="02">2월</option><option value="03">3월</option>
            <option value="04">4월</option><option value="05">5월</option><option value="06">6월</option>
            <option value="07">7월</option><option value="08">8월</option><option value="09">9월</option>
            <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
        </select>
        <button onclick="loadForViewer()" style="margin-left:10px; padding:7px 12px; cursor:pointer; border-radius:5px; border:1px solid #ccc;">🔄 새로고침</button>
    </div>

    <div class="table-wrapper">
        <table id="logTable">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>개인 오더</th>
                    <th>업체명</th>
                    <th>금액</th>
                    <th>작업자</th>
                    <th>장소</th>
                    <th>유형</th>
                    <th>비고 (클릭 시 전체보기)</th>
                </tr>
            </thead>
            <tbody id="viewerList"></tbody>
        </table>
        <div id="loader">데이터를 불러오는 중...</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxoy3X2D_0OXAN-_2VHgFY9QQAQDMNNaBKPXw6MD7skeiQDXfJYEQlAsT9T2CTVqSfesg/exec";
    let cachedData = []; 

    function initFilter() {
        const yearSelect = document.getElementById('filterYear');
        const currYear = new Date().getFullYear();
        for(let i = currYear - 1; i <= currYear + 1; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.innerText = i + "년";
            if(i === currYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }
        document.getElementById('filterMonth').value = ("0" + (new Date().getMonth() + 1)).slice(-2);
    }

    function fixDate(d) {
        if (!d) return "";
        let date = new Date(d);
        if (isNaN(date.getTime())) return String(d).split('T')[0];
        return `${date.getFullYear()}-${("0"+(date.getMonth()+1)).slice(-2)}-${("0"+date.getDate()).slice(-2)}`;
    }

    function toggleNote(el) {
        el.classList.toggle('note-truncate');
        el.classList.toggle('note-full');
    }

    function applyFilter() {
        const targetYear = document.getElementById('filterYear').value;
        const targetMonth = document.getElementById('filterMonth').value;
        const list = document.getElementById('viewerList');
        list.innerHTML = '';

        let totalSales = 0;
        let totalMyPay = 0;

        const filtered = cachedData.filter(d => {
            const dStr = fixDate(d.date);
            if (targetMonth === 'all') return dStr.startsWith(targetYear);
            return dStr.startsWith(`${targetYear}-${targetMonth}`);
        });

        filtered.sort((a,b) => new Date(fixDate(a.date)) - new Date(fixDate(b.date))).forEach(d => {
            const amt = parseInt(String(d.amount).replace(/,/g, '')) || 0;
            const isMyBiz = d.myBiz === true || d.myBiz === "true";
            const isExcluded = d.isExclude === true || d.isExclude === "true"; // 수당 제외 여부 확인

            // 계산 로직: 제외 항목(isExcluded)이 아닐 때만 합계에 포함
            if (!isExcluded) {
                totalSales += amt;
                totalMyPay += isMyBiz ? (amt * 0.1) + (amt * 0.4) : (amt * 0.4);
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${fixDate(d.date)}</td>
                <td>${isMyBiz ? '<span class="my-biz-badge">송하늘 오더</span>' : '-'}</td>
                <td>${d.company || '-'}</td>
                <td class="amt-text">${amt.toLocaleString()}원</td>
                <td>${d.worker || '-'}</td>
                <td>${d.location || '-'}</td>
                <td>${d.type || '-'}</td>
                <td class="note-text note-truncate" title="${d.note || ''}" onclick="toggleNote(this)">
                    ${d.note || '-'}
                </td>
            `;
            list.appendChild(row);
        });

        document.getElementById('vTotal').innerText = totalSales.toLocaleString() + "원";
        document.getElementById('vShare').innerText = Math.floor(totalMyPay).toLocaleString() + "원";
        
        if (filtered.length === 0) {
            list.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px;">해당 기간의 데이터가 없습니다.</td></tr>';
        }
    }

    async function loadForViewer() {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('loader').innerText = "데이터를 불러오는 중...";
        try {
            const resp = await fetch(`${API_URL}?t=${Date.now()}`);
            cachedData = await resp.json();
            document.getElementById('loader').style.display = 'none';
            applyFilter();
        } catch(e) {
            document.getElementById('loader').innerText = "❌ 데이터를 가져오는데 실패했습니다.";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initFilter();
        loadForViewer();
    });
</script>
</body>
</html>
